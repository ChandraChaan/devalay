<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Devalay{% endblock %}</title>
  <style>
    :root { --bg:#FFF8EE; --fg:#3E2723; --muted:#795548; --accent:#E65100; --card:#FFFFFF; }
    @media (prefers-color-scheme: dark) { :root { --bg:#1A120E; --fg:#F5E9DD; --muted:#C8B2A2; --accent:#FFA040; --card:#241914; } }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
    h1 { color:var(--accent); line-height:1.2; } h2 { margin-top:2em; }
    a { color:var(--accent); } .muted { color:var(--muted); }
    .card { background:var(--card); border-radius:16px; padding:20px; margin:16px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  </style>
</head>
<body><main>{% block body %}{% endblock %}</main></body>
</html>
