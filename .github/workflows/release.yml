name: Release

# Pushing a tag such as v1.2.0 builds the public APK (static mode: it reads the
# pre-rendered API on GitHub Pages, so no server is needed) and attaches it to a
# GitHub release whose notes come from that version's section in CHANGELOG.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  PAGES_URL: https://chandrachaan.github.io/devalay

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.5"
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEY_PROPERTIES secrets are required for releases"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          echo "$KEY_PROPERTIES" > android/key.properties
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is required so releases ship Crashlytics, push and force update"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Build APKs
        run: |
          VERSION="${TAG#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          BUILD=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          # --split-debug-info keeps the Dart symbols out of the app (about 0.9 MB less to download) and writes
          # them to build/symbols. The AOT build is deterministic, so all three builds below share one set.
          ARGS="--release --build-name=$VERSION --build-number=$BUILD --split-debug-info=build/symbols --dart-define=STATIC_API=true --dart-define=API_BASE_URL=$PAGES_URL"
          mkdir -p dist
          flutter build apk $ARGS
          cp build/app/outputs/flutter-apk/app-release.apk dist/devalay.apk
          flutter build apk $ARGS --split-per-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp build/app/outputs/flutter-apk/app-$abi-release.apk dist/devalay-$abi.apk
          done
          # The App Bundle is what Google Play takes; Play re-signs it with the Play app signing key.
          flutter build appbundle $ARGS
          cp build/app/outputs/bundle/release/app-release.aab dist/devalay-play.aab
          # Dart symbols for this release; turn a crash trace back into file and line with `flutter symbolize`.
          (cd build/symbols && zip -q ../../dist/devalay-symbols.zip *.symbols)
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS)
      - name: Upload Dart symbols to Crashlytics
        # Optional: needs a FIREBASE_SERVICE_ACCOUNT secret (JSON key of a service account with the Firebase
        # Crashlytics Admin role). Without it, Crashlytics shows Dart traces as addresses; symbolize them locally
        # from devalay-symbols.zip.
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set; Dart symbols are only attached to the release"
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          APP_ID=$(jq -r '.client[] | select(.client_info.android_client_info.package_name == "com.chandrachaan.devalay")
            | .client_info.mobilesdk_app_id' android/app/google-services.json)
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
            npx --yes firebase-tools crashlytics:symbols:upload --app="$APP_ID" build/symbols
          rm "$RUNNER_TEMP/firebase-sa.json"
      - name: Check the release key signed it
        # keytool only reads v1 (JAR) signatures; minSdk 24 builds are signed with v2 only
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          for apk in dist/*.apk; do "$APKSIGNER" verify --print-certs "$apk" | grep -q "DN: CN=Devalay"; done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## v?" v "( |$)" {f=1; next} /^## /{f=0} f' ../CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ### Download

          **[devalay.apk](https://github.com/${{ github.repository }}/releases/download/$TAG/devalay.apk)** works on every Android 7+ phone.
          The smaller \`devalay-arm64-v8a.apk\` suits most phones from 2017 on. Check downloads against \`SHA256SUMS\`.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "Devalay $TAG" --notes-file notes.md --verify-tag
          fi
