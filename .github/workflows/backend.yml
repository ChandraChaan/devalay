name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: devalay
          POSTGRES_PASSWORD: devalay
          POSTGRES_DB: devalay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devalay" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEVALAY_DATABASE_URL: postgresql+psycopg://devalay:devalay@localhost:5432/devalay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Cache JPL ephemeris
        uses: actions/cache@v4
        with:
          path: backend/data
          key: ephemeris-de421
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Seed is idempotent
        run: |
          python -m app.cli seed
          python -m app.cli seed --no-books
      - name: Tests (PostgreSQL)
        run: |
          psql postgresql://devalay:devalay@localhost:5432/devalay -c "drop schema public cascade; create schema public;"
          pytest -q --cov=app --cov-report=term-missing:skip-covered
      - name: Tests (SQLite)
        env:
          DEVALAY_DATABASE_URL: ""
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t devalay-api:ci backend
      - name: Smoke test container
        run: |
          docker network create devalay
          docker run -d --name db --network devalay -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=devalay postgres:17-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 1; done
          docker run -d --name api --network devalay -p 8000:8000 \
            -e DEVALAY_DATABASE_URL=postgresql+psycopg://postgres:pw@db:5432/devalay \
            -e DEVALAY_SECRET_KEY=ci-only-secret-key-that-is-long-enough \
            -e DEVALAY_SEED_ON_START=1 devalay-api:ci
          for i in $(seq 1 60); do curl -sf localhost:8000/api/v1/health && break; sleep 2; done
          curl -sf "localhost:8000/api/v1/home" > /dev/null
          docker logs api | tail -20
